name: Build Photino Desktop (.NET 10)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows App
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter "Smartik.Desktop.csproj" | Select-Object -First 1
          
          # Публикуем приложение в папку ./publish-win со всеми ассетами
          dotnet publish $($csproj.FullName) `
            -c Release `
            -r win-x64 `
            -o ./publish-win `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true

      - name: Zip Output Folder
        shell: pwsh
        run: |
          # Архивируем .exe вместе со сгенерированной папкой wwwroot
          Compress-Archive -Path ./publish-win/* -DestinationPath ./Smartik-Windows.zip

      - name: Create GitHub Release and Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: ./Smartik-Windows.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
