name: Build Photino Desktop (.NET 10)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Single EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows App (Auto-Search Project)
        shell: pwsh
        run: |
          # Автоматически находим правильный путь к файлу проекта, где бы он ни лежал
          $csproj = Get-ChildItem -Recurse -Filter "Smartik.Desktop.csproj" | Select-Object -First 1
          if (-not $csproj) { throw "Файл Smartik.Desktop.csproj не найден в репозитории!" }
          
          Write-Host "Найден проект: $($csproj.FullName)" -ForegroundColor Green
          
          # Запускаем сборку с вашими флагами
          dotnet publish $($csproj.FullName) `
            -c Release `
            -r win-x64 `
            -o ./publish-win `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true

      - name: Create GitHub Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish-win/Smartik.Desktop.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
